{{ define "main" }}
<article class="post clip-page">
  <header class="post-header">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    <h1>{{ .Title }}</h1>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ with .Params.tags }}
  <div class="post-tags">
    {{ range . }}<a href="{{ "tags/" | absURL }}{{ . | urlize }}/">#{{ . }}</a> {{ end }}
  </div>
  {{ end }}

  <div class="clip-cta">
    <a href="https://www.youtube.com/watch?v={{ .Params.video_id }}" target="_blank" rel="noopener">Watch on YouTube</a>
  </div>
</article>
{{ end }}
