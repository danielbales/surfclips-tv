<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "feed.xml" | absURL }}">

  {{/* OG / Social sharing */}}
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ with .Params.thumbnail }}<meta property="og:image" content="{{ . }}">{{ end }}
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R0DG8XXPZ5"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-R0DG8XXPZ5');</script>

  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}?v=4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.css">
  <script src="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <img src="{{ "images/sctv-logo.jpg" | absURL }}" alt="Surf Clips TV" class="logo-icon" width="36" height="36">
        <span class="logo-text">Surf Clips TV</span>
      </a>
      <nav class="site-nav">
        <a href="{{ .Site.Params.youtube_channel }}" target="_blank" rel="noopener" class="nav-yt">YouTube</a>
        <a href="{{ "shop/" | absURL }}" class="nav-merch">Shop</a>
      </nav>
      <button class="nav-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">Surf Clips TV</span>
        <p class="footer-tagline">{{ .Site.Params.tagline }}</p>
      </div>
      <div class="footer-links">
        <a href="{{ .Site.Params.youtube_channel }}" target="_blank" rel="noopener">YouTube</a>
        <a href="{{ "shop/" | absURL }}">Merch</a>
        <a href="{{ "feed.xml" | absURL }}">RSS</a>
      </div>
      <p class="footer-copy">&copy; {{ now.Year }} Surf Clips TV</p>
    </div>
  </footer>

  <script>
    document.querySelector('.nav-toggle')?.addEventListener('click', function() {
      document.querySelector('.site-nav').classList.toggle('open');
    });
  </script>
</body>
</html>
