<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}Surf Clips TV | Best Surf Videos, Weekly Top 10s &amp; Shorts{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | absURL }}">

  {{/* OG / Social sharing */}}
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ with .Params.thumbnail }}{{ . }}{{ else }}{{ "images/sctv-logo.jpg" | absURL }}{{ end }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  {{ if .IsPage }}<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if not .IsHome }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ with .Params.thumbnail }}{{ . }}{{ else }}{{ "images/sctv-logo.jpg" | absURL }}{{ end }}">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R0DG8XXPZ5"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-R0DG8XXPZ5');</script>

  <link rel="icon" type="image/jpeg" href="{{ "images/sctv-logo.jpg" | absURL }}">
  <link rel="apple-touch-icon" href="{{ "images/sctv-logo.jpg" | absURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}?v=11">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.css">
  <script src="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <img src="{{ "images/sctv-logo.jpg" | absURL }}" alt="Surf Clips TV" class="logo-icon" width="36" height="36">
        <span class="logo-text">Surf Clips TV</span>
      </a>
      <nav class="site-nav">
        <a href="{{ .Site.Params.youtube_channel }}" target="_blank" rel="noopener" class="nav-yt">YouTube</a>
        <a href="mailto:worldwidewaves360@gmail.com">Contact</a>
        <a href="{{ "archive/" | absURL }}">Archive</a>
        <a href="{{ "shop/" | absURL }}" class="nav-merch">Shop</a>
        <a href="#" class="nav-search" aria-label="Search clips" id="search-toggle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></a>
      </nav>
      <div class="header-actions">
        <a href="#" class="mobile-search" aria-label="Search clips" onclick="event.preventDefault();document.getElementById('search-toggle').click()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></a>
        <button class="nav-toggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">Surf Clips TV</span>
        <p class="footer-tagline">{{ .Site.Params.tagline }}</p>
      </div>
      <form class="footer-email-form email-form" id="footer-email-form">
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off">
        <input type="email" name="email" placeholder="Your email" required class="email-input">
        <button type="submit" class="btn btn-subscribe btn-sm">Sign Up</button>
      </form>
      <p class="email-msg" id="footer-email-msg"></p>
      <div class="footer-links">
        <a href="{{ .Site.Params.youtube_channel }}" target="_blank" rel="noopener">YouTube</a>
        <a href="{{ "shop/" | absURL }}">Merch</a>
        <a href="{{ "index.xml" | absURL }}">RSS</a>
      </div>
      <p class="footer-copy">&copy; {{ now.Year }} Surf Clips TV</p>
    </div>
  </footer>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay">
    <div class="search-overlay-header">
      <input type="text" class="search-input" id="search-input" placeholder="Search surfers, clips, tags..." autocomplete="off" autofocus>
      <button class="search-close" id="search-close" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

  <script>
    document.querySelector('.nav-toggle')?.addEventListener('click', function() {
      document.querySelector('.site-nav').classList.toggle('open');
    });

    (function() {
      var SHEET_URL = '{{ .Site.Params.email_form_url }}';
      function handleSubmit(form, msgEl) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          if (form.querySelector('input[name="website"]').value) return;
          var email = form.querySelector('input[name="email"]').value;
          var btn = form.querySelector('button');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          msgEl.textContent = '';
          msgEl.className = 'email-msg';
          fetch(SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ email: email })
          }).then(function() {
            msgEl.textContent = "You're in! Watch your inbox.";
            msgEl.classList.add('email-success');
            form.reset();
            btn.disabled = false;
            btn.textContent = 'Sign Up';
          }).catch(function() {
            msgEl.textContent = 'Something went wrong. Try again.';
            msgEl.classList.add('email-error');
            btn.disabled = false;
            btn.textContent = 'Sign Up';
          });
        });
      }
      var f = document.getElementById('footer-email-form');
      var m = document.getElementById('footer-email-msg');
      if (f && m) handleSubmit(f, m);
    })();

    // --- Search ---
    (function() {
      var overlay = document.getElementById('search-overlay');
      var input = document.getElementById('search-input');
      var resultsEl = document.getElementById('search-results');
      var toggle = document.getElementById('search-toggle');
      var closeBtn = document.getElementById('search-close');
      var fuse = null;
      var indexLoaded = false;

      function openSearch() {
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        input.value = '';
        resultsEl.innerHTML = '';
        setTimeout(function() { input.focus(); }, 100);
        if (!indexLoaded) loadIndex();
      }

      function closeSearch() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      function loadIndex() {
        fetch('/index.json')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            fuse = new Fuse(data, {
              keys: [
                { name: 'title', weight: 0.4 },
                { name: 'surfers', weight: 0.35 },
                { name: 'tags', weight: 0.25 }
              ],
              threshold: 0.35,
              ignoreLocation: true,
              minMatchCharLength: 2
            });
            indexLoaded = true;
          });
      }

      function renderResults(results) {
        if (!results.length) {
          resultsEl.innerHTML = '<p class="search-empty">No clips found.</p>';
          return;
        }
        var html = '<div class="search-grid">';
        results.slice(0, 24).forEach(function(r) {
          var item = r.item;
          html += '<a href="' + item.url + '" class="clip-card">';
          if (item.thumbnail) {
            html += '<img src="' + item.thumbnail + '" alt="' + item.title.replace(/"/g, '&quot;') + '" loading="lazy">';
          }
          html += '<div class="clip-card-body">';
          html += '<h3>' + item.title.replace(/\x3c/g, '&lt;') + '</h3>';
          html += '<time>' + item.date + '</time>';
          html += '</div></a>';
        });
        html += '</div>';
        if (results.length > 24) {
          html += '<p class="search-more">' + (results.length - 24) + ' more results</p>';
        }
        resultsEl.innerHTML = html;
      }

      toggle.addEventListener('click', function(e) {
        e.preventDefault();
        openSearch();
      });

      closeBtn.addEventListener('click', closeSearch);

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeSearch();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay.classList.contains('open')) closeSearch();
        if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !overlay.classList.contains('open')) {
          e.preventDefault();
          openSearch();
        }
      });

      var debounceTimer;
      input.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        var q = input.value.trim();
        if (q.length < 2) {
          resultsEl.innerHTML = '';
          return;
        }
        debounceTimer = setTimeout(function() {
          if (fuse) renderResults(fuse.search(q));
        }, 150);
      });
    })();
  </script>
</body>
</html>
