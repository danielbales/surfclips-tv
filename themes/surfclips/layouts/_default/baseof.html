<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}Surf Clips TV | Best Surf Videos, Weekly Top 10s &amp; Shorts{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | absURL }}">

  {{/* OG / Social sharing */}}
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ with .Params.thumbnail }}{{ . }}{{ else }}{{ "images/sctv-logo.jpg" | absURL }}{{ end }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  {{ if .IsPage }}<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if not .IsHome }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ with .Params.thumbnail }}{{ . }}{{ else }}{{ "images/sctv-logo.jpg" | absURL }}{{ end }}">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R0DG8XXPZ5"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-R0DG8XXPZ5');</script>

  <link rel="icon" type="image/jpeg" href="{{ "images/sctv-logo.jpg" | absURL }}">
  <link rel="apple-touch-icon" href="{{ "images/sctv-logo.jpg" | absURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}?v=9">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.css">
  <script src="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <img src="{{ "images/sctv-logo.jpg" | absURL }}" alt="Surf Clips TV" class="logo-icon" width="36" height="36">
        <span class="logo-text">Surf Clips TV</span>
      </a>
      <nav class="site-nav">
        <a href="{{ .Site.Params.youtube_channel }}" target="_blank" rel="noopener" class="nav-yt">YouTube</a>
        <a href="mailto:worldwidewaves360@gmail.com">Contact</a>
        <a href="{{ "archive/" | absURL }}">Archive</a>
        <a href="{{ "shop/" | absURL }}" class="nav-merch">Shop</a>
      </nav>
      <button class="nav-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">Surf Clips TV</span>
        <p class="footer-tagline">{{ .Site.Params.tagline }}</p>
      </div>
      <form class="footer-email-form email-form" id="footer-email-form">
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off">
        <input type="email" name="email" placeholder="Your email" required class="email-input">
        <button type="submit" class="btn btn-subscribe btn-sm">Sign Up</button>
      </form>
      <p class="email-msg" id="footer-email-msg"></p>
      <div class="footer-links">
        <a href="{{ .Site.Params.youtube_channel }}" target="_blank" rel="noopener">YouTube</a>
        <a href="{{ "shop/" | absURL }}">Merch</a>
        <a href="{{ "index.xml" | absURL }}">RSS</a>
      </div>
      <p class="footer-copy">&copy; {{ now.Year }} Surf Clips TV</p>
    </div>
  </footer>

  <script>
    document.querySelector('.nav-toggle')?.addEventListener('click', function() {
      document.querySelector('.site-nav').classList.toggle('open');
    });

    (function() {
      var SHEET_URL = '{{ .Site.Params.email_form_url }}';
      function handleSubmit(form, msgEl) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          if (form.querySelector('input[name="website"]').value) return;
          var email = form.querySelector('input[name="email"]').value;
          var btn = form.querySelector('button');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          msgEl.textContent = '';
          msgEl.className = 'email-msg';
          fetch(SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
          }).then(function() {
            msgEl.textContent = "You're in! Watch your inbox.";
            msgEl.classList.add('email-success');
            form.reset();
            btn.disabled = false;
            btn.textContent = 'Sign Up';
          }).catch(function() {
            msgEl.textContent = 'Something went wrong. Try again.';
            msgEl.classList.add('email-error');
            btn.disabled = false;
            btn.textContent = 'Sign Up';
          });
        });
      }
      var f1 = document.getElementById('email-form');
      var m1 = document.getElementById('email-msg');
      if (f1 && m1) handleSubmit(f1, m1);
      var f2 = document.getElementById('footer-email-form');
      var m2 = document.getElementById('footer-email-msg');
      if (f2 && m2) handleSubmit(f2, m2);
    })();
  </script>
</body>
</html>
